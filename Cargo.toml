[package]
name = "handl-plugin-lib-otlp-std"
version.workspace = true
edition.workspace = true
description = "Concrete OTLP/HTTP exporter using `ureq`."
license.workspace = true
repository.workspace = true

[dependencies]
# ADR-0128 Phase 4: platform crates are git deps; the workspace-root
# `[patch]` resolves them from the sibling `../platform` checkout.
handl-value = { git = "https://github.com/handl-lang/platform", rev = "59765334d5088dd9948041458a24420e6a65856b" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/platform", rev = "59765334d5088dd9948041458a24420e6a65856b" }
handl-platform = { git = "https://github.com/handl-lang/platform", rev = "59765334d5088dd9948041458a24420e6a65856b" }
serde_json = "1"
handl-plugin-lib-otlp = { path = "../lib-otlp" }
ureq = "2"
